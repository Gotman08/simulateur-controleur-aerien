<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="656" viewBox="0 0 1360 656" role="img" aria-labelledby="title description">
<title id="title">ATC training system architecture</title>
<desc id="description">The local Windows application uses FastAPI, React and a headless BlueSky simulator. Prompt building, the ICAO knowledge base, deterministic safety validation, per-callsign voices and the VHF filter stay on the local PC. A double-headed HTTPS connection using /v1/audio/* and /v1/chat/* connects the application to interchangeable OpenAI-compatible providers: the self-hosted server.py facade on ROMEO with fine-tuned Whisper, Mistral and XTTS; hosted APIs such as OpenAI, Mistral API and Groq; or local gateways such as vLLM and LiteLLM.</desc>
<rect width="1360" height="656" fill="#ffffff"/>
<text x="32" y="44" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="start" fill="#20252c">ATC training system</text>
<line x1="32" y1="64" x2="1328" y2="64" stroke="#d8dce1" stroke-width="1"/>
<rect x="32" y="92" width="480" height="528" fill="white" stroke="#747d89" stroke-width="1.25"/>
<line x1="32" y1="180" x2="512" y2="180" stroke="#d8dce1" stroke-width="1"/>
<rect x="848" y="92" width="480" height="528" fill="white" stroke="#747d89" stroke-width="1.25"/>
<line x1="848" y1="180" x2="1328" y2="180" stroke="#d8dce1" stroke-width="1"/>
<text x="56" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#20252c">LOCAL PC</text>
<text x="56" y="158" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#59616d">Windows · Python 3.12</text>
<text x="872" y="130" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" text-anchor="start" fill="#20252c">AI PROVIDERS</text>
<text x="872" y="158" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" text-anchor="start" fill="#59616d">Interchangeable via .env</text>
<rect x="56" y="204" width="432" height="392" fill="white" stroke="#747d89" stroke-width="1.25"/>
<rect x="56" y="204" width="432" height="80" fill="#f5f6f8" stroke="#747d89" stroke-width="1.25"/>
<text x="80" y="240" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="start" fill="#20252c">Training application</text>
<text x="80" y="267" font-family="Consolas, Liberation Mono, monospace" font-size="17" font-weight="400" text-anchor="start" fill="#59616d">FastAPI + React</text>
<text x="80" y="331" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20252c">BlueSky simulator (headless)</text>
<line x1="56" y1="361" x2="488" y2="361" stroke="#d8dce1" stroke-width="1"/>
