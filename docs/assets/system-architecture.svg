<text x="80" y="485" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20252c">Deterministic safety validation</text>
<line x1="56" y1="515" x2="488" y2="515" stroke="#d8dce1" stroke-width="1"/>
<text x="80" y="562" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" text-anchor="start" fill="#20252c">Per-callsign voice + VHF filter</text>
<text x="872" y="216" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" text-anchor="start" fill="#20252c">Any OpenAI-compatible service</text>
