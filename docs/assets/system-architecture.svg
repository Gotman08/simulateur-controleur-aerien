<polygon id="arrowhead-to-local" points="512,356 523,350.5 523,361.5" fill="#344b65"/>
<polygon id="arrowhead-to-provider" points="848,356 837,350.5 837,361.5" fill="#344b65"/>
<text x="680" y="399" font-family="Consolas, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="middle" fill="#59616d">/v1/audio/*</text>
<text x="680" y="429" font-family="Consolas, Liberation Mono, monospace" font-size="18" font-weight="400" text-anchor="middle" fill="#59616d">/v1/chat/*</text>
</svg>
